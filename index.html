<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חופשה כהלכה - בלוג טיולים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #1e293b; direction: rtl; line-height: 1.6; }
    header { background: linear-gradient(135deg, #1e3a8a 0%, #0d9488 100%); color: white; padding: 50px 20px; text-align: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
    header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
    header p { font-size: 1.1rem; opacity: 0.9; }
    
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px 60px 20px; }
    
    /* טופס הוספת טיול */
    .add-form-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; border: 1px solid #e2e8f0; }
    .add-form-card h2 { font-size: 1.3rem; color: #0f172a; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; text-align: right; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 5px; color: #475569; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
    .btn-submit { background-color: #0d9488; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn-submit:hover { background-color: #0f766e; }

    /* גריד טיולים */
    .trips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .trip-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
    .trip-title { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 10px; }
    .trip-badge { display: inline-block; background-color: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; }
    .trip-description { color: #64748b; font-size: 0.95rem; }
    .status-msg { background: white; padding: 30px; border-radius: 16px; text-align: center; color: #64748b; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>🌲 חופשה כהלכה 🌲</h1>
    <p>בלוג הטיולים והמסלולים שלי</p>
  </header>

  <div class="container">
    
    <!-- טופס הוספת טיול מהיר -->
    <div class="add-form-card">
      <h2>✨ הוספת טיול חדש לבלוג</h2>
      <div class="form-group">
        <label>שם הטיול / המסלול:</label>
        <input type="text" id="input-title" placeholder="לדוגמה: טיול לנחל עמוד">
      </div>
      <div class="form-group">
        <label>אזור / מיקום:</label>
        <input type="text" id="input-location" placeholder="לדוגמה: גליל עליון">
      </div>
      <div class="form-group">
        <label>תיאור המסלול:</label>
        <textarea id="input-desc" rows="3" placeholder="ספרי מעט על החוויה, רמת הקושי וההמלצות..."></textarea>
      </div>
      <button class="btn-submit" onclick="addTrip()">פרסמי טיול חדש</button>
      <div id="form-status" style="margin-top: 10px; font-weight: 500;"></div>
    </div>

    <!-- רשימת הטיולים -->
    <h2 style="margin-bottom: 20px; color: #1e293b;">🏔️ המסלולים המומלצים:</h2>
    <div id="trips-container" class="trips-grid">
      <div class="status-msg">טוען טיולים...</div>
    </div>

  </div>

  <script>
    const PROJECT_ID = 'bqnvb6rm';
    const DATASET = 'production';
    const QUERY = encodeURIComponent('*[_type == "trip"]');
    const FETCH_URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

    // טעינת הטיולים
    function loadTrips() {
      fetch(FETCH_URL)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('trips-container');
          const trips = data.result || [];

          if (trips.length === 0) {
            container.innerHTML = '<div class="status-msg">עדיין לא הוכנסו טיולים. מילאי את הטופס למעלה והוסיפי את הטיול הראשון! 🌿</div>';
            return;
          }

          container.innerHTML = trips.map(trip => `
            <div class="trip-card">
              ${trip.location ? `<span class="trip-badge">📍 ${trip.location}</span>` : ''}
              <h3 class="trip-title">${trip.title || 'ללא כותרת'}</h3>
              <p class="trip-description">${trip.description || ''}</p>
            </div>
          `).join('');
        })
        .catch(err => {
          console.error(err);
          document.getElementById('trips-container').innerHTML = '<div class="status-msg">שגיאה בטעינת הנתונים.</div>';
        });
    }

    // הוספת טיול מקומי לתצוגה
    function addTrip() {
      const title = document.getElementById('input-title').value;
      const location = document.getElementById('input-location').value;
      const desc = document.getElementById('input-desc').value;
      const statusDiv = document.getElementById('form-status');

      if (!title) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'אנא הזיני לפחות שם לטיול.';
        return;
      }

      statusDiv.style.color = 'green';
      statusDiv.innerText = 'הטיול התווסף בהצלחה למסך!';

      // הכנסת הטיול החדש ישירות לרשימה המוצגת
      const container = document.getElementById('trips-container');
      const newCard = `
        <div class="trip-card">
          ${location ? `<span class="trip-badge">📍 ${location}</span>` : ''}
          <h3 class="trip-title">${title}</h3>
          <p class="trip-description">${desc}</p>
        </div>
      `;

      if (container.querySelector('.status-msg')) {
        container.innerHTML = newCard;
      } else {
        container.innerHTML = newCard + container.innerHTML;
      }

      // איפוס השדות
      document.getElementById('input-title').value = '';
      document.getElementById('input-location').value = '';
      document.getElementById('input-desc').value = '';
    }

    // הפעלה בטעינה
    loadTrips();
  </script>

</body>
</html>
