<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול ועריכת טיולים - חופשה כהלכה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #faf8f5;
      --card-bg: #ffffff;
      --text-main: #2c3531;
      --text-muted: #728078;
      --accent-pink: #d88399;
      --accent-hover: #c37085;
      --border-color: #efece6;
      --accent-red: #e53935;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Assistant', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; direction: rtl; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 35px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-bottom: 40px; }
    h1, h2 { color: var(--text-main); font-weight: 700; margin-bottom: 20px; border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; }
    
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { margin-bottom: 18px; text-align: right; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: #fdfcfb; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent-pink); }
    
    .days-container { background: var(--bg-color); padding: 20px; border-radius: 14px; border: 1px dashed #e0ded8; margin: 20px 0; }
    .day-box { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 15px; }
    .day-num { font-weight: 700; color: var(--accent-pink); margin-bottom: 10px; }
    
    .btn-add-day { background: #efece6; color: var(--text-main); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-block; }
    .btn-submit { background: var(--accent-pink); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-submit:hover { background: var(--accent-hover); }
    
    .trip-edit-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
    .trip-actions { display: flex; gap: 8px; }
    .btn-edit { background: #e0e7e3; color: #3b5249; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-delete { background: #fde8e8; color: var(--accent-red); border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #f1f5f9; color: #64748b; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 10px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. עריכת הגדרות וטקסטים כלליים של האתר -->
    <div class="card">
      <h2>⚙️ עריכת טקסטים כלליים והגדרות האתר</h2>
      
      <div class="form-group">
        <label>סלוגן ראשי בכותרת העליונה:</label>
        <input type="text" id="site-subtitle" placeholder="בלוג הטיולים, המסלולים והחוויות שלי בעולם">
      </div>

      <div class="form-group">
        <label>טקסט בסרגל הצדי (מי אני):</label>
        <textarea id="site-sidebar-bio" rows="3" placeholder="נעים מאוד, אני תמר! אוהבת לטייל..."></textarea>
      </div>

      <div class="form-group">
        <label>קישור לתמונת פרופיל בסרגל הצדי:</label>
        <input type="text" id="site-sidebar-img" placeholder="https://example.com/profile.jpg">
      </div>

      <div class="form-group">
        <label>תוכן דף "אודות / עלינו":</label>
        <textarea id="site-about-text" rows="4" placeholder="היי, אני תמר! הבלוג הזה נולד מתוך..."></textarea>
      </div>

      <div class="form-group">
        <label>כיתוב הסבר בדף "צור קשר":</label>
        <textarea id="site-contact-text" rows="2" placeholder="רוצים להתייעץ? מוזמנים לכתוב לי בשמחה!"></textarea>
      </div>

      <div class="form-group">
        <label>כתובת המייל שלך לקבלת פניות מציבור הגולשים:</label>
        <input type="email" id="site-contact-email" placeholder="email@example.com">
      </div>

      <button class="btn-submit" type="button" onclick="saveSiteSettings()">💾 עדכני טקסטים והגדרות בבלוג</button>
      <div id="settings-status" style="margin-top: 12px; text-align: center; font-weight: 600;"></div>
    </div>

    <!-- 2. הוספת / עריכת מסלול טיול -->
    <div class="card">
      <h1 id="form-heading">🔐 מערכת ניהול - הוספת מסלול טיול</h1>
      <input type="hidden" id="edit-trip-id" value="">
      
      <div class="form-row">
        <div class="form-group">
          <label>כותרת הטיול / המסלול:</label>
          <input type="text" id="trip-title" placeholder="לדוגמה: מדריך למדיירה: מסלולים ומלונות מומלצים">
        </div>
        <div class="form-group">
          <label>מדינה / יעד:</label>
          <input type="text" id="trip-destination" placeholder="לדוגמה: פורטוגל 🇵🇹">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>משך הטיול:</label>
          <input type="text" id="trip-days-count" placeholder="לדוגמה: 7 ימים">
        </div>
        <div class="form-group">
          <label>עונה / חודש:</label>
          <input type="text" id="trip-season" placeholder="לדוגמה: אוקטובר 2026">
        </div>
      </div>

      <div class="form-group">
        <label>קישור לתמונה ראשית (Cover Image):</label>
        <input type="text" id="trip-cover-img" placeholder="https://example.com/cover.jpg">
      </div>

      <div class="form-group">
        <label>הקדמה וסיכום הטיול:</label>
        <textarea id="trip-intro" rows="6" placeholder="ספרי על הטיול... (ללא הגבלת אורך)"></textarea>
      </div>

      <div class="form-group">
        <label>דף סיכום / טיפים, כתובות ומלונות (אופציונלי):</label>
        <textarea id="trip-summary-page" rows="3" placeholder="כתובות גוגל מפס, מלונות מומלצים, טיפים לרכב..."></textarea>
      </div>

      <div class="days-container">
        <h3 style="margin-bottom: 15px; color: var(--accent-pink);">📅 ימי המסלול:</h3>
        <div id="days-list"></div>
        <button type="button" class="btn-add-day" id="btn-add-day-trigger">+ הוספי יום נוסף</button>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn-submit" id="btn-save" type="button" onclick="saveTrip()">🚀 שמרי ופרסמי לאתר</button>
        <button type="button" class="btn-cancel" id="btn-cancel-edit" style="display:none;" onclick="resetForm()">ביטול עריכה</button>
      </div>
      <div id="status" style="margin-top: 12px; text-align: center; font-weight: 600;"></div>
    </div>

    <!-- 3. רשימת טיולים קיימים לעריכה ומחיקה -->
    <div class="card">
      <h2>✏️ עריכת / מחיקת טיולים שכבר הועלו</h2>
      <div id="existing-trips-list">
        <div style="color: var(--text-muted); text-align: center;">טוען טיולים קיימים...</div>
      </div>
    </div>

  </div>

  <script>
    var SANITY_WRITE_TOKEN = "skY3FGsIUJK9qk4ekjnh1PgKBV591OPVXGCuTwTf8udM9wjnEWsE9BSJWMg0OOIIpGTMNPMi1TNEpTlTjnj1qq72wFRyVGRaf3jmxAERt8fatUkJOKqAPN76wKmfEeu8tubVii6PzbWOfYfuAhk41OFDJgQtBdCuLC5Vyt9smH6ue1o82oY9";
    var PROJECT_ID = "bqnvb6rm";
    var DATASET = "production";

    // ---------------------- ניהול הגדרות אתר ----------------------
    function loadSiteSettings() {
      var QUERY = encodeURIComponent('*[_type == "siteSettings"][0]');
      var URL = 'https://' + PROJECT_ID + '.api.sanity.io/v2021-10-21/data/query/' + DATASET + '?query=' + QUERY;

      fetch(URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.result) {
            var s = data.result;
            if(s.subtitle) document.getElementById('site-subtitle').value = s.subtitle;
            if(s.sidebarBio) document.getElementById('site-sidebar-bio').value = s.sidebarBio;
            if(s.sidebarImg) document.getElementById('site-sidebar-img').value = s.sidebarImg;
            if(s.aboutText) document.getElementById('site-about-text').value = s.aboutText;
            if(s.contactText) document.getElementById('site-contact-text').value = s.contactText;
            if(s.contactEmail) document.getElementById('site-contact-email').value = s.contactEmail;
          }
        })
        .catch(function(e) { console.error(e); });
    }

    function saveSiteSettings() {
      var statusDiv = document.getElementById('settings-status');
      statusDiv.style.color = 'var(--accent-pink)';
      statusDiv.innerText = 'מעדכן הגדרות בענן... ⏳';

      var settingsDoc = {
        _id: 'siteSettings',
        _type: 'siteSettings',
        subtitle: document.getElementById('site-subtitle').value,
        sidebarBio: document.getElementById('site-sidebar-bio').value,
        sidebarImg: document.getElementById('site-sidebar-img').value,
        aboutText: document.getElementById('site-about-text').value,
        contactText: document.getElementById('site-contact-text').value,
        contactEmail: document.getElementById('site-contact-email').value
      };

      var URL = 'https://' + PROJECT_ID + '.api.sanity.io/v2021-10-21/data/mutate/' + DATASET;

      fetch(URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SANITY_WRITE_TOKEN
        },
        body: JSON.stringify({ mutations: [{ createOrReplace: settingsDoc }] })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.error) {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'שגיאה בעדכון: ' + (data.error.description || 'שגיאה מ-Sanity');
        } else {
          statusDiv.style.color = '#2e7d32';
          statusDiv.innerText = '✨ הטקסטים וההגדרות עודכנו בהצלחה!';
        }
      })
      .catch(function(err) {
        console.error(err);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'שגיאה בחיבור ל-Sanity.';
      });
    }

    // ---------------------- ניהול טיולים ----------------------
    var dayCount = 0;

    function createDayBox(data) {
      dayCount++;
      var div = document.createElement('div');
      div.className = 'day-box';
      
      var titleVal = (data && data.title) ? data.title : '';
      var descVal = (data && data.desc) ? data.desc : '';
      var imgsVal = '';
      if (data && data.imgs && Array.isArray(data.imgs)) {
        imgsVal = data.imgs.map(function(i) {
          return i.url + (i.caption ? ' | ' + i.caption : '');
        }).join('\n');
      }

      div.innerHTML = 
        '<div class="day-num">יום ' + dayCount + ':</div>' +
        '<div class="form-group"><input type="text" class="day-title" value="" placeholder="כותרת היום..."></div>' +
        '<div class="form-group"><textarea class="day-desc" rows="3" placeholder="פירוט החוויות..."></textarea></div>' +
        '<div class="form-group">' +
          '<label>תמונות + כיתוב (URL | כיתוב לתמונה):</label>' +
          '<textarea class="day-imgs" rows="2" placeholder="https://example.com/img.jpg | כיתוב לתמונה"></textarea>' +
        '</div>';
      
      document.getElementById('days-list').appendChild(div);

      div.querySelector('.day-title').value = titleVal;
      div.querySelector('.day-desc').value = descVal;
      div.querySelector('.day-imgs').value = imgsVal;
    }

    document.getElementById('btn-add-day-trigger').addEventListener('click', function() {
      createDayBox(null);
    });

    var loadedTripsData = [];

    function loadExistingTrips() {
      var QUERY = encodeURIComponent('*[_type == "trip"]');
      var URL = 'https://' + PROJECT_ID + '.api.sanity.io/v2021-10-21/data/query/' + DATASET + '?query=' + QUERY;

      fetch(URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          loadedTripsData = (data && data.result) ? data.result : [];
          var listDiv = document.getElementById('existing-trips-list');
          if (loadedTripsData.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center; color: var(--text-muted);">עדיין לא העלית טיולים.</div>';
            return;
          }
          
          listDiv.innerHTML = '';
          for (var i = 0; i < loadedTripsData.length; i++) {
            var t = loadedTripsData[i];
            var item = document.createElement('div');
            item.className = 'trip-edit-item';
            
            var info = document.createElement('div');
            info.innerHTML = '<strong>' + escapeHtml(t.title || 'ללא כותרת') + '</strong> <span style="font-size:0.85rem; color: var(--text-muted);">(' + escapeHtml(t.location || 'ללא יעד') + ')</span>';
            
            var actions = document.createElement('div');
            actions.className = 'trip-actions';
            
            var btnEdit = document.createElement('button');
            btnEdit.className = 'btn-edit';
            btnEdit.type = 'button';
            btnEdit.innerText = 'עריכה ✏️';
            btnEdit.onclick = (function(tripId) {
              return function() { editTrip(tripId); };
            })(t._id);

            var btnDel = document.createElement('button');
            btnDel.className = 'btn-delete';
            btnDel.type = 'button';
            btnDel.innerText = 'מחיקה 🗑️';
            btnDel.onclick = (function(tripId) {
              return function() { deleteTrip(tripId); };
            })(t._id);

            actions.appendChild(btnEdit);
            actions.appendChild(btnDel);
            item.appendChild(info);
            item.appendChild(actions);
            listDiv.appendChild(item);
          }
        })
        .catch(function(err) {
          console.error(err);
          document.getElementById('existing-trips-list').innerHTML = '<div style="text-align:center; color:red;">שגיאה בטעינת הטיולים.</div>';
        });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function editTrip(id) {
      var trip = null;
      for (var i = 0; i < loadedTripsData.length; i++) {
        if (loadedTripsData[i]._id === id) { trip = loadedTripsData[i]; break; }
      }
      if (!trip) return;

      document.getElementById('edit-trip-id').value = trip._id || '';
      document.getElementById('trip-title').value = trip.title || '';
      document.getElementById('trip-destination').value = trip.location || '';
      document.getElementById('trip-days-count').value = trip.daysCount || '';
      document.getElementById('trip-season').value = trip.season || '';
      document.getElementById('trip-cover-img').value = trip.coverImage || '';
      document.getElementById('trip-intro').value = trip.description || '';
      document.getElementById('trip-summary-page').value = trip.summaryPage || '';

      document.getElementById('days-list').innerHTML = '';
      dayCount = 0;
      var days = [];
      try { days = trip.daysJson ? JSON.parse(trip.daysJson) : []; } catch(e){}

      if (days.length > 0) {
        days.forEach(function(d) { createDayBox(d); });
      } else {
        createDayBox(null);
      }

      document.getElementById('form-heading').innerText = '✏️ עריכת מסלול קיים';
      document.getElementById('btn-save').innerText = 'עדכני טיול בענן 💾';
      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteTrip(id) {
      if (!confirm('האם את בטוחה שברצונך למחוק את הטיול הזה? הפעולה אינה ניתנת לביטול.')) {
        return;
      }

      var statusDiv = document.getElementById('status');
      statusDiv.style.color = 'var(--accent-pink)';
      statusDiv.innerText = 'מוחק מ-Sanity... ⏳';

      var URL = 'https://' + PROJECT_ID + '.api.sanity.io/v2021-10-21/data/mutate/' + DATASET;

      fetch(URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SANITY_WRITE_TOKEN
        },
        body: JSON.stringify({ mutations: [{ delete: { id: id } }] })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.error) {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'שגיאה במחיקה: ' + (data.error.description || 'שגיאה מ-Sanity');
        } else {
          statusDiv.style.color = '#2e7d32';
          statusDiv.innerText = '🗑️ הטיול נמחק בהצלחה!';
          resetForm();
          setTimeout(function() {
            loadExistingTrips();
          }, 800);
        }
      })
      .catch(function(err) {
        console.error(err);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'שגיאה בחיבור ל-Sanity.';
      });
    }

    function resetForm() {
      document.getElementById('edit-trip-id').value = '';
      document.getElementById('trip-title').value = '';
      document.getElementById('trip-destination').value = '';
      document.getElementById('trip-days-count').value = '';
      document.getElementById('trip-season').value = '';
      document.getElementById('trip-cover-img').value = '';
      document.getElementById('trip-intro').value = '';
      document.getElementById('trip-summary-page').value = '';
      document.getElementById('days-list').innerHTML = '';
      dayCount = 0;
      createDayBox(null);

      document.getElementById('form-heading').innerText = '🔐 מערכת ניהול - הוספת מסלול טיול';
      document.getElementById('btn-save').innerText = '🚀 שמרי ופרסמי לאתר';
      document.getElementById('btn-cancel-edit').style.display = 'none';
      document.getElementById('status').innerText = '';
    }

    function saveTrip() {
      var title = document.getElementById('trip-title').value;
      var statusDiv = document.getElementById('status');
      var editId = document.getElementById('edit-trip-id').value;

      if (!title) { alert('נא למלא כותרת'); return; }

      statusDiv.style.color = 'var(--accent-pink)';
      statusDiv.innerText = 'שומר בענן... ⏳';

      var dayBoxes = document.querySelectorAll('.day-box');
      var days = [];
      dayBoxes.forEach(function(box, i) {
        var dTitle = box.querySelector('.day-title').value;
        var dDesc = box.querySelector('.day-desc').value;
        var imgsText = box.querySelector('.day-imgs').value;
        
        var imgs = imgsText.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; }).map(function(line) {
          var parts = line.split('|');
          return { url: parts[0].trim(), caption: parts[1] ? parts[1].trim() : '' };
        });

        if (dTitle || dDesc) {
          days.push({ num: i + 1, title: dTitle, desc: dDesc, imgs: imgs });
        }
      });

      var tripFields = {
        title: title,
        location: document.getElementById('trip-destination').value,
        daysCount: document.getElementById('trip-days-count').value,
        season: document.getElementById('trip-season').value,
        coverImage: document.getElementById('trip-cover-img').value,
        description: document.getElementById('trip-intro').value,
        summaryPage: document.getElementById('trip-summary-page').value,
        daysJson: JSON.stringify(days)
      };

      var mutation = [];
      if (editId) {
        mutation = [{ patch: { id: editId, set: tripFields } }];
      } else {
        tripFields._type = 'trip';
        mutation = [{ create: tripFields }];
      }

      var URL = 'https://' + PROJECT_ID + '.api.sanity.io/v2021-10-21/data/mutate/' + DATASET;

      fetch(URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SANITY_WRITE_TOKEN
        },
        body: JSON.stringify({ mutations: mutation })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.error) {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'שגיאה בעדכון: ' + (data.error.description || 'שגיאה מ-Sanity');
        } else {
          statusDiv.style.color = '#2e7d32';
          statusDiv.innerText = '✨ הטיול עודכן ונשמר בהצלחה בענן!';
          setTimeout(function() {
            resetForm();
            loadExistingTrips();
          }, 800);
        }
      })
      .catch(function(err) {
        console.error(err);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'שגיאה בחיבור ל-Sanity.';
      });
    }

    createDayBox(null);
    loadExistingTrips();
    loadSiteSettings();
  </script>
</body>
</html>
