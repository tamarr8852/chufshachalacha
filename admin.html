<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ניהול - חופשה כהלכה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Assistant', sans-serif; 
      background-color: #faf9f6; 
      color: #2c3531; 
      padding: 40px 20px; 
      direction: rtl; 
      line-height: 1.6;
    }
    .container { max-width: 850px; margin: 0 auto; }
    .card { 
      background: white; 
      padding: 30px; 
      border-radius: 16px; 
      border: 1px solid #e8ece9; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
    }
    h1 { 
      color: #3b5249; 
      margin-bottom: 20px; 
      font-size: 1.8rem; 
      border-bottom: 2px solid #f2f0ea; 
      padding-bottom: 10px; 
    }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { margin-bottom: 18px; text-align: right; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-family: inherit; 
      font-size: 0.95rem;
    }
    .days-container { 
      background: #fdfdfd; 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px dashed #cbd5e1; 
      margin: 20px 0; 
    }
    .day-box { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid #e8ece9; 
      margin-bottom: 15px; 
    }
    .day-num { font-weight: 700; color: #3b5249; margin-bottom: 10px; }
    .btn-add-day { 
      background: #e8ece9; 
      color: #2c3531; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
    }
    .btn-submit { 
      background: #3b5249; 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 1.1rem; 
      cursor: pointer; 
      width: 100%; 
    }
    .btn-submit:hover { background: #2b3d36; }
    .hint { font-size: 0.82rem; color: #5f6c65; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>🔐 מערכת ניהול - הוספת מסלול טיול</h1>
      
      <div class="form-row">
        <div class="form-group">
          <label>כותרת הטיול / המסלול:</label>
          <input type="text" id="trip-title" placeholder="לדוגמה: 8 ימים בצפון איטליה">
        </div>
        <div class="form-group">
          <label>מדינה / יעד:</label>
          <input type="text" id="trip-destination" placeholder="לדוגמה: איטליה 🇮🇹">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>משך הטיול:</label>
          <input type="text" id="trip-days-count" placeholder="לדוגמה: 8 ימים">
        </div>
        <div class="form-group">
          <label>עונה / חודש:</label>
          <input type="text" id="trip-season" placeholder="לדוגמה: ספטמבר 2026">
        </div>
      </div>

      <div class="form-group">
        <label>הקדמה / תיאור כללי:</label>
        <textarea id="trip-intro" rows="4" placeholder="ספרי על הטיול... (ירידות שורה יישמרו בדיוק כפי שתקלידי)"></textarea>
      </div>

      <div class="days-container">
        <h3 style="margin-bottom: 15px; color: #3b5249;">📅 ימי המסלול:</h3>
        <div id="days-list">
          <div class="day-box">
            <div class="day-num">יום 1:</div>
            <div class="form-group">
              <input type="text" class="day-title" placeholder="כותרת היום...">
            </div>
            <div class="form-group">
              <textarea class="day-desc" rows="3" placeholder="פירוט..."></textarea>
            </div>
            <div class="form-group">
              <label>תמונות + כיתוב (הזיני URL | כיתוב):</label>
              <textarea class="day-imgs" rows="2" placeholder="https://example.com/img1.jpg | הנוף מאגם גוזאו&#10;https://example.com/img2.jpg | הבריכות המוצלות"></textarea>
              <span class="hint">פורמט: URL | כיתוב קצר לתמונה (כל תמונה בשורה חדשה)</span>
            </div>
          </div>
        </div>
        <button type="button" class="btn-add-day" onclick="addDay()">+ הוספי יום נוסף</button>
      </div>

      <button class="btn-submit" onclick="saveTrip()">🚀 שמרי ופרסמי לאתר</button>
      <div id="status" style="margin-top: 12px; text-align: center; font-weight: 600;"></div>
    </div>
  </div>

  <script>
    let count = 1;
    function addDay() {
      count++;
      const div = document.createElement('div');
      div.className = 'day-box';
      div.innerHTML = `
        <div class="day-num">יום ${count}:</div>
        <div class="form-group"><input type="text" class="day-title" placeholder="כותרת היום..."></div>
        <div class="form-group"><textarea class="day-desc" rows="3" placeholder="פירוט..."></textarea></div>
        <div class="form-group">
          <textarea class="day-imgs" rows="2" placeholder="URL | כיתוב לתמונה"></textarea>
        </div>
      `;
      document.getElementById('days-list').appendChild(div);
    }

    function saveTrip() {
      const title = document.getElementById('trip-title').value;
      const statusDiv = document.getElementById('status');

      if (!title) { 
        alert('נא למלא כותרת למסלול'); 
        return; 
      }

      statusDiv.style.color = '#3b5249';
      statusDiv.innerText = 'שומר את הטיול בענן... ⏳';

      const dayBoxes = document.querySelectorAll('.day-box');
      const days = [];
      dayBoxes.forEach((box, i) => {
        const dTitle = box.querySelector('.day-title').value;
        const dDesc = box.querySelector('.day-desc').value;
        const imgsText = box.querySelector('.day-imgs').value;
        
        const imgs = imgsText.split('\n').map(s => s.trim()).filter(s => s.length > 0).map(line => {
          const parts = line.split('|');
          return {
            url: parts[0].trim(),
            caption: parts[1] ? parts[1].trim() : ''
          };
        });

        if (dTitle || dDesc) {
          days.push({ num: i + 1, title: dTitle, desc: dDesc, imgs });
        }
      });

      const tripDoc = {
        _type: 'trip',
        title: title,
        location: document.getElementById('trip-destination').value,
        daysCount: document.getElementById('trip-days-count').value,
        season: document.getElementById('trip-season').value,
        description: document.getElementById('trip-intro').value,
        daysJson: JSON.stringify(days)
      };

      const PROJECT_ID = 'bqnvb6rm';
      const DATASET = 'production';
      const URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/mutate/${DATASET}`;

      fetch(URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mutations: [{ create: tripDoc }] })
      })
      .then(res => res.json())
      .then(data => {
        statusDiv.innerText = '✨ הטיול נשמר בהצלחה ב-Sanity בענן! מופיע עכשיו לכולם בבלוג.';
      })
      .catch(err => {
        console.error(err);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'הייתה שגיאה בשמירה ל-Sanity.';
      });
    }
  </script>

</body>
</html>
